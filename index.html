<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fuga · A1 第9单元 闪卡</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #e8edf2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .phone-frame {
            width: 390px;
            max-width: 100%;
            background: #f4f9f7;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            height: 844px;
            max-height: 100vh;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }

        .pages-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 20px 20px 20px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .pages-container::-webkit-scrollbar {
            width: 0;
            display: none;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 4px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .page-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: -0.3px;
        }
        .page-header h1 span {
            color: #4a9e8e;
        }
        .page-header .sub {
            font-size: 14px;
            color: #7f8c8d;
            font-weight: 400;
            background: #eef2f6;
            padding: 4px 14px;
            border-radius: 20px;
        }

        .mode-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .mode-tab {
            flex: 1;
            min-width: 80px;
            padding: 10px 0;
            border: 2px solid #d5dce4;
            border-radius: 30px;
            background: #fff;
            font-size: 13px;
            font-weight: 600;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            text-align: center;
        }
        .mode-tab.active {
            background: #4a9e8e;
            border-color: #4a9e8e;
            color: #fff;
            box-shadow: 0 4px 12px rgba(74, 158, 142, 0.25);
        }
        .mode-tab i {
            margin-right: 4px;
        }

        .card-counter {
            text-align: center;
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .card-counter strong {
            color: #2c3e50;
            font-size: 18px;
        }

        .flashcard {
            background: #ffffff;
            border-radius: 32px;
            padding: 32px 24px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(200, 212, 220, 0.25);
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            position: relative;
        }
        .flashcard:active {
            transform: scale(0.98);
        }

        .flashcard .card-front {
            width: 100%;
        }
        .flashcard .card-front .main-word {
            font-size: 34px;
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.3;
            letter-spacing: -0.3px;
            word-break: break-word;
        }
        .flashcard .card-front .main-word.chinese-mode {
            font-size: 26px;
            color: #2c3e50;
        }
        .flashcard .card-front .main-word.small-word {
            font-size: 24px;
        }
        .flashcard .card-front .main-word.small-word.chinese-mode {
            font-size: 20px;
        }

        .flashcard .card-back {
            width: 100%;
            display: none;
            animation: fadeUp 0.25s ease;
        }
        .flashcard .card-back .meaning {
            font-size: 34px;
            font-weight: 700;
            color: #4a9e8e;
            line-height: 1.4;
        }
        .flashcard .card-back .meaning.chinese-mode {
            font-size: 26px;
            color: #4a9e8e;
        }
        .flashcard .card-back .meaning.italian-mode {
            font-size: 34px;
            font-weight: 700;
            color: #4a9e8e;
        }
        .flashcard .card-back .meaning.small-meaning {
            font-size: 24px;
        }
        .flashcard .card-back .meaning.small-meaning.chinese-mode {
            font-size: 20px;
        }
        .flashcard .card-back .meaning.small-meaning.italian-mode {
            font-size: 24px;
        }

        .flashcard.show-back .card-front {
            display: none;
        }
        .flashcard.show-back .card-back {
            display: block;
        }

        .flashcard .hint-tap {
            position: absolute;
            bottom: 12px;
            right: 18px;
            font-size: 12px;
            color: #bccbd8;
            letter-spacing: 0.5px;
        }
        .flashcard .hint-tap i {
            margin-right: 4px;
        }

        .audio-btn {
            position: absolute;
            bottom: 12px;
            left: 18px;
            background: rgba(74, 158, 142, 0.12);
            border: none;
            border-radius: 30px;
            padding: 6px 14px 6px 10px;
            font-size: 13px;
            color: #4a9e8e;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            transition: 0.2s;
            backdrop-filter: blur(2px);
        }
        .audio-btn:hover {
            background: rgba(74, 158, 142, 0.2);
        }
        .audio-btn:active {
            transform: scale(0.92);
        }
        .audio-btn i {
            font-size: 15px;
        }
        .audio-btn .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a9e8e;
            transition: 0.2s;
        }
        .audio-btn .status-dot.playing {
            background: #e67e22;
            animation: pulse-dot 0.8s infinite;
        }
        @keyframes pulse-dot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }

        .nav-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .nav-row button {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 18px;
            background: #e8f0ee;
            color: #4a9e8e;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .nav-row button:active {
            transform: scale(0.95);
        }
        .nav-row button.primary {
            background: #4a9e8e;
            color: #fff;
        }
        .nav-row button.primary:active {
            background: #3a7a6e;
        }
        .nav-row button:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .bottom-meta {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #a0b4c4;
            padding: 0 4px;
        }
        .bottom-meta .progress-text {
            background: #eef2f6;
            padding: 4px 16px;
            border-radius: 30px;
            color: #2c3e50;
            font-weight: 500;
        }

        .footer-copyright {
            margin-top: 20px;
            padding: 16px 12px 8px 12px;
            border-top: 1px solid #e0e8ee;
            text-align: center;
            font-size: 12px;
            color: #9aabb8;
            line-height: 1.8;
            letter-spacing: 0.3px;
        }
        .footer-copyright .brand {
            font-weight: 600;
            color: #4a9e8e;
            letter-spacing: 0.5px;
        }
        .footer-copyright .wechat {
            color: #7f8c8d;
            font-family: 'Courier New', monospace;
            font-weight: 500;
            background: #f0f4f8;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 2px;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 420px) {
            .phone-frame {
                width: 100%;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                padding: 0;
            }
            body {
                padding: 0;
                background: #f4f9f7;
            }
            .pages-container {
                padding: 8px 16px 20px 16px;
            }
            .flashcard {
                padding: 24px 18px;
                min-height: 180px;
            }
            .flashcard .card-front .main-word {
                font-size: 28px;
            }
            .flashcard .card-front .main-word.chinese-mode {
                font-size: 22px;
            }
            .flashcard .card-front .main-word.small-word {
                font-size: 20px;
            }
            .flashcard .card-front .main-word.small-word.chinese-mode {
                font-size: 18px;
            }
            .flashcard .card-back .meaning {
                font-size: 28px;
            }
            .flashcard .card-back .meaning.chinese-mode {
                font-size: 22px;
            }
            .flashcard .card-back .meaning.italian-mode {
                font-size: 28px;
            }
            .flashcard .card-back .meaning.small-meaning {
                font-size: 20px;
            }
            .flashcard .card-back .meaning.small-meaning.chinese-mode {
                font-size: 18px;
            }
            .flashcard .card-back .meaning.small-meaning.italian-mode {
                font-size: 20px;
            }
            .audio-btn {
                font-size: 12px;
                padding: 4px 12px 4px 8px;
                bottom: 10px;
                left: 12px;
            }
            .footer-copyright {
                font-size: 11px;
                padding: 12px 8px 6px 8px;
            }
        }

        @media (max-width: 380px) {
            .mode-tab {
                font-size: 12px;
                min-width: 60px;
                padding: 8px 0;
            }
            .flashcard .card-front .main-word {
                font-size: 24px;
            }
            .flashcard .card-front .main-word.chinese-mode {
                font-size: 20px;
            }
            .flashcard .card-front .main-word.small-word {
                font-size: 18px;
            }
            .flashcard .card-back .meaning {
                font-size: 24px;
            }
            .flashcard .card-back .meaning.chinese-mode {
                font-size: 20px;
            }
            .flashcard .card-back .meaning.italian-mode {
                font-size: 24px;
            }
            .flashcard .card-back .meaning.small-meaning {
                font-size: 18px;
            }
            .nav-row button {
                font-size: 13px;
                padding: 12px 0;
            }
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="pages-container" id="pagesContainer">
            <div class="page-header">
                <h1>✨ <span>Fuga</span> 学员专属</h1>
                <span class="sub"><i class="fas fa-book-open"></i> A1 第9单元</span>
            </div>

            <div class="mode-tabs" id="modeTabs">
                <button class="mode-tab active" data-mode="order"><i class="fas fa-list"></i> 顺序</button>
                <button class="mode-tab" data-mode="shuffle"><i class="fas fa-random"></i> 乱序</button>
                <button class="mode-tab" data-mode="chinese"><i class="fas fa-language"></i> 反推</button>
            </div>

            <div class="card-counter">
                第 <strong id="currentNum">1</strong> / <span id="totalNum">0</span> 张
            </div>

            <div class="flashcard" id="flashcard">
                <div class="card-front" id="cardFront">
                    <div class="main-word" id="mainWord">nonno</div>
                </div>
                <div class="card-back" id="cardBack">
                    <div class="meaning" id="meaningBack">爷爷；外公</div>
                </div>
                <div class="hint-tap"><i class="fas fa-hand-pointer"></i> 点击翻转</div>
                <button class="audio-btn" id="audioBtn" title="播放单词发音">
                    <i class="fas fa-volume-up"></i>
                    <span id="audioLabel">发音</span>
                    <span class="status-dot" id="audioDot"></span>
                </button>
            </div>

            <div class="nav-row">
                <button id="prevBtn"><i class="fas fa-arrow-left"></i> 上一张</button>
                <button class="primary" id="nextBtn">下一张 <i class="fas fa-arrow-right"></i></button>
            </div>

            <div class="bottom-meta">
                <span>✅ 已学 <span id="learnedCount">0</span></span>
                <span class="progress-text" id="progressText">0%</span>
            </div>

            <div class="footer-copyright">
                <div class="brand">口袋意语 · Fuga意大利语工作室</div>
                <div style="font-size: 11px; color: #b0c4d0;">内部学习资料 · 未经授权不得转载、商用</div>
                <div style="margin-top: 4px;">
                    <span class="wechat"><i class="fab fa-weixin" style="margin-right: 4px; color: #4a9e8e;"></i> FCFCFCZXFC</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // A1 第9单元 词表（已去除词性标识）
        // ============================================================
        const RAW_WORDS = [
            { word: 'nonno', meaning: '爷爷；外公' },
            { word: 'nonna', meaning: '奶奶；外婆' },
            { word: 'madre', meaning: '母亲' },
            { word: 'padre', meaning: '父亲' },
            { word: 'genitori', meaning: '父母' },
            { word: 'zio', meaning: '叔叔；舅舅；伯父' },
            { word: 'zia', meaning: '婶婶；舅妈；伯母' },
            { word: 'cugino', meaning: '表兄弟；堂兄弟' },
            { word: 'cugina', meaning: '表姐妹；堂姐妹' },
            { word: 'nipote', meaning: '孙子（女）；侄子（女）；外甥（女）' },
            { word: 'parente', meaning: '亲戚' },
            { word: 'marito', meaning: '丈夫' },
            { word: 'moglie', meaning: '妻子' },
            { word: 'fidanzato', meaning: '未婚夫' },
            { word: 'fidanzata', meaning: '未婚妻' },
            { word: 'mio', meaning: '我的' },
            { word: 'tuo', meaning: '你的' },
            { word: 'suo', meaning: '他/她/您的' },
            { word: 'nostro', meaning: '我们的' },
            { word: 'vostro', meaning: '你们的' },
            { word: 'loro', meaning: '他们的' },
            { word: 'orologio', meaning: '钟表' },
            { word: 'essere più … di …', meaning: '和……相比更……' },
            { word: 'mamma', meaning: '妈妈' },
            { word: 'papà', meaning: '爸爸' },
            { word: 'Di chi è?', meaning: '是谁的？' },
            { word: 'maggiore', meaning: '（年龄）大的' },
            { word: 'donna', meaning: '女人' },
            { word: 'esatto', meaning: '正确的' },
            { word: 'naturalmente', meaning: '自然地' },
            { word: 'volo', meaning: '航班' },
            { word: 'collega', meaning: '同事' },
            { word: 'per questo', meaning: '因此' },
            { word: 'progetto', meaning: '项目' },
            { word: 'sentire', meaning: '听说' },
            { word: 'vivere', meaning: '生活' },
            { word: 'numeroso', meaning: '人数众多的' },
            { word: 'unico', meaning: '独一无二的' },
            { word: 'figlio unico', meaning: '独生子' },
            { word: 'normale', meaning: '正常的' },
            { word: 'secondo te', meaning: '你觉得' },
            { word: 'mammone', meaning: '妈宝' },
            { word: 'né', meaning: '也不' },
            { word: 'non … né …', meaning: '既不……也不……' },
            { word: 'discutere di …', meaning: '讨论……' },
            { word: 'povero', meaning: '可怜的' },
            { word: 'braccio', meaning: '胳膊' },
            { word: 'da solo', meaning: '独自' },
            { word: 'palazzo', meaning: '大厦' },
            { word: 'telefonare a ...', meaning: '给……打电话' },
            { word: 'familiare', meaning: '家人' },
            { word: 'età', meaning: '年龄' },
            { word: 'professione', meaning: '职业' },
            { word: 'classe', meaning: '班级' },
            { word: 'generoso', meaning: '慷慨的' }
        ];

        console.log('✅ A1 第9单元 总词条数:', RAW_WORDS.length);

        // ============================================================
        // 状态
        // ============================================================
        let mode = 'order';
        let currentIndex = 0;
        let currentList = [];
        let learnedSet = new Set();

        let audioElement = null;
        let isAudioPlaying = false;

        // DOM
        const flashcard = document.getElementById('flashcard');
        const mainWord = document.getElementById('mainWord');
        const meaningBack = document.getElementById('meaningBack');
        const currentNum = document.getElementById('currentNum');
        const totalNum = document.getElementById('totalNum');
        const learnedCount = document.getElementById('learnedCount');
        const progressText = document.getElementById('progressText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const audioBtn = document.getElementById('audioBtn');
        const audioLabel = document.getElementById('audioLabel');
        const audioDot = document.getElementById('audioDot');

        // ============================================================
        // 工具
        // ============================================================
        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function getDisplayList() {
            if (mode === 'order') return [...RAW_WORDS];
            if (mode === 'shuffle') return shuffleArray(RAW_WORDS);
            if (mode === 'chinese') return [...RAW_WORDS];
            return [...RAW_WORDS];
        }

        function isLongWord(text) {
            return text && text.length > 22;
        }

        function getRawIndex(wordObj) {
            return RAW_WORDS.findIndex(item =>
                item.word === wordObj.word && item.meaning === wordObj.meaning
            );
        }

        // ============================================================
        // 音频 - 文件名格式：A1vocabolario9 - segment N.mp3
        // ============================================================
        function getAudioPath(rawIndex) {
            const segNum = rawIndex + 1;
            return `A1vocabolario9 - segment ${segNum}.mp3`;
        }

        function playAudio() {
            const currentItem = currentList[currentIndex];
            if (!currentItem) return;

            const rawIndex = getRawIndex(currentItem);
            if (rawIndex === -1) {
                audioLabel.textContent = '未找到';
                audioDot.className = 'status-dot';
                setTimeout(() => { audioLabel.textContent = '发音'; }, 1000);
                return;
            }

            const audioSrc = getAudioPath(rawIndex);
            if (!audioElement) {
                audioElement = new Audio();
                audioElement.addEventListener('ended', () => {
                    isAudioPlaying = false;
                    audioDot.className = 'status-dot';
                    audioLabel.textContent = '发音';
                });
                audioElement.addEventListener('error', () => {
                    isAudioPlaying = false;
                    audioDot.className = 'status-dot';
                    audioLabel.textContent = '⚠️';
                    setTimeout(() => { audioLabel.textContent = '发音'; }, 1200);
                });
            }

            if (isAudioPlaying) {
                audioElement.pause();
                audioElement.currentTime = 0;
                isAudioPlaying = false;
                audioDot.className = 'status-dot';
                audioLabel.textContent = '发音';
                return;
            }

            audioElement.src = audioSrc;
            audioElement.load();
            audioElement.play().then(() => {
                isAudioPlaying = true;
                audioDot.className = 'status-dot playing';
                audioLabel.textContent = '播放中';
            }).catch((err) => {
                console.warn('音频加载失败:', audioSrc, err);
                audioDot.className = 'status-dot';
                audioLabel.textContent = '⚠️';
                setTimeout(() => { audioLabel.textContent = '发音'; }, 1000);
                isAudioPlaying = false;
            });
        }

        function stopAudio() {
            if (audioElement) {
                audioElement.pause();
                audioElement.currentTime = 0;
                isAudioPlaying = false;
                audioDot.className = 'status-dot';
                audioLabel.textContent = '发音';
            }
        }

        // ============================================================
        // 渲染
        // ============================================================
        function renderCard() {
            if (!currentList.length) return;
            const item = currentList[currentIndex];
            const isChineseMode = (mode === 'chinese');

            const wordIsLong = isLongWord(item.word);
            const meaningIsLong = isLongWord(item.meaning);

            if (isChineseMode) {
                mainWord.textContent = item.meaning;
                mainWord.className = 'main-word chinese-mode' + (meaningIsLong ? ' small-word' : '');
            } else {
                mainWord.textContent = item.word;
                mainWord.className = 'main-word' + (wordIsLong ? ' small-word' : '');
            }

            if (isChineseMode) {
                meaningBack.textContent = item.word;
                meaningBack.className = 'meaning italian-mode' + (wordIsLong ? ' small-meaning' : '');
            } else {
                meaningBack.textContent = item.meaning;
                meaningBack.className = 'meaning chinese-mode' + (meaningIsLong ? ' small-meaning' : '');
            }

            flashcard.classList.remove('show-back');

            currentNum.textContent = currentIndex + 1;
            totalNum.textContent = currentList.length;

            learnedCount.textContent = learnedSet.size;
            const progress = currentList.length ? Math.round((learnedSet.size / currentList.length) * 100) : 0;
            progressText.textContent = progress + '%';

            prevBtn.disabled = (currentIndex === 0);
            nextBtn.disabled = (currentIndex === currentList.length - 1);

            stopAudio();
        }

        // ============================================================
        // 模式切换
        // ============================================================
        function switchMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.mode === mode);
            });
            currentIndex = 0;
            learnedSet = new Set();
            currentList = getDisplayList();
            renderCard();
            stopAudio();
        }

        // ============================================================
        // 导航
        // ============================================================
        function nextCard() {
            if (currentIndex < currentList.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        // ============================================================
        // 翻转 & 标记已学
        // ============================================================
        flashcard.addEventListener('click', function(e) {
            if (e.target.closest('.audio-btn')) return;
            this.classList.toggle('show-back');
            if (this.classList.contains('show-back')) {
                const key = currentIndex + '-' + (currentList[currentIndex]?.word || '');
                learnedSet.add(key);
                learnedCount.textContent = learnedSet.size;
                const progress = currentList.length ? Math.round((learnedSet.size / currentList.length) * 100) : 0;
                progressText.textContent = progress + '%';
            }
        });

        // ============================================================
        // 音频按钮
        // ============================================================
        audioBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            playAudio();
        });

        // ============================================================
        // 初始化
        // ============================================================
        function init() {
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    switchMode(this.dataset.mode);
                });
            });

            prevBtn.addEventListener('click', prevCard);
            nextBtn.addEventListener('click', nextCard);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') nextCard();
                if (e.key === 'ArrowLeft') prevCard();
                if (e.key === ' ') {
                    e.preventDefault();
                    flashcard.click();
                }
                if (e.key === 'p' || e.key === 'P') {
                    e.preventDefault();
                    playAudio();
                }
            });

            currentList = getDisplayList();
            renderCard();
            console.log(`✨ Fuga学员专属 · A1 第9单元 闪卡已加载 (共 ${RAW_WORDS.length} 项) ✅`);
            console.log(`📁 音频文件命名格式: A1vocabolario9 - segment 1.mp3 ~ ${RAW_WORDS.length}.mp3`);
        }

        init();
    </script>
</body>
</html>
